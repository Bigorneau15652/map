<script>
  // index.html?demo=1 loads a mock Grist API + a real (trimmed) data sample
  // instead of the real grist-plugin-api.js, so this exact file can be
  // exercised end-to-end (fetch -> classification -> render) without a
  // live Grist document. See mock-grist.js / demo-seed.js.
  (function () {
    var demo = /(?:^|[?&])demo=1(?:&|$)/.test(location.search);
    if (demo) {
      document.write('<script src="demo-seed.js"><\/script>');
      document.write('<script src="mock-grist.js"><\/script>');
    } else {
      document.write('<script src="https://docs.getgrist.com/grist-plugin-api.js"><\/script>');
    }

</script>

<script>
'use strict';

/* ---------------------------------------------------------------------
 * Config — noms de tables/colonnes attendus dans le document Grist.
 * Basé sur le document "Bac à sable SIPI" fourni. À ajuster ici si votre
 * document utilise des noms différents (pas d'UI de configuration : ce
 * widget est volontairement simple, la classification vit déjà dans
 * BDD_Salles, il n'y a rien d'autre à faire correspondre).
 * ------------------------------------------------------------------- */
const TABLES = {
  sites: 'BDD_Sites',
  batiments: 'BDD_Batiments',
  salles: 'BDD_Salles',
  categories: 'Ref_Categorie_SCE',
  sousCategories: 'Ref_SS_Categorie_SCE',
};
const COL = {
  site: { id: 'id', nom: 'Nom' },
  batiment: { id: 'id', nom: 'Nom', site: 'Site', appellation: 'Appellation', destruction: 'Destruction', finExploitation: 'Date_de_fin_d_exploitation' },
  salle: { id: 'id', numero: 'Numero', batiment: 'Batiment', site: 'Site', surface: 'Surface_utile_m2_', chauffee: 'Surface_Chaufee', rafraichie: 'Surface_Rafraichie', categorie: 'Categorie_SCE_OPERAT', sousCategorie: 'SS_categorie_SCE_OPERAT' },
  categorie: { id: 'id', nom: 'Ref_Categorie_SCE' },
  sousCategorie: { id: 'id', categorie: 'Categorie', nom: 'Nom_SousCategorie', code: 'Code_technique_OPERAT' },
};

// Les 5 entités fonctionnelles assujetties (EFA) encore en activité pour
// l'UMPV, au sens du décret éco énergie tertiaire. Les autres sites du
// document (ex. Abbé de l'Epée, Université du Tiers Temps, Sites BU) sont
// hors scope et volontairement ignorés.
const EFA_NAMES = ['Route de Mende', 'Béziers', 'Saint-Charles', 'Saint-Louis', 'Boutonnet'];

const NOM_CATEGORIE_A_REPARTIR = 'À répartir';
const NOM_CATEGORIE_LOCAL_VACANT = 'Local vacant';
const DOMINANT_THRESHOLD = 0.70; // règle "catégorie forte >= 70%"
const MAX_SELECTED = 3; // règle "2 ou 3 sous-catégories moyennement fortes"

const STATUSES = ['CR', 'C', 'R', 'N'];
const STATUS_LABEL = {
  CR: 'Chauffée + rafraîchie',
  C: 'Chauffée (seule)',
  R: 'Rafraîchie (seule)',
  N: 'Non chauffée / non rafraîchie',
};
const STATUS_CLASS = { CR: 'cr', C: 'c', R: 'r', N: 'n' };

/* ---------------------------------------------------------------------
 * Chargement des données
 * ------------------------------------------------------------------- */

function toRows(cols) {
  const keys = Object.keys(cols).filter((k) => k !== 'id');
  const n = cols.id ? cols.id.length : 0;
  const rows = [];
  for (let i = 0; i < n; i++) {
    const row = { id: cols.id[i] };
    for (const k of keys) row[k] = cols[k][i];
    rows.push(row);
  }
  return rows;
}

function truthy(v) {
  return v === true || v === 1 || v === '1';
}

async function fetchTableSafe(tableName) {
  try {
    const cols = await grist.docApi.fetchTable(tableName);
    return { ok: true, rows: toRows(cols) };
  } catch (e) {
    return { ok: false, error: String((e && e.message) || e) };
  }
}

let DATA = null; // { sites, batiments, salles, categoriesById, sousCategoriesById, idARepartir, loadErrors }

async function loadData() {
  const [sites, batiments, salles, categories, sousCategories] = await Promise.all([
    fetchTableSafe(TABLES.sites),
    fetchTableSafe(TABLES.batiments),
    fetchTableSafe(TABLES.salles),
    fetchTableSafe(TABLES.categories),
    fetchTableSafe(TABLES.sousCategories),
  ]);

  const loadErrors = [];
  [
    ['sites', sites], ['batiments', batiments], ['salles', salles],
    ['categories', categories], ['sousCategories', sousCategories],
  ].forEach(([key, res]) => {
    if (!res.ok) loadErrors.push(`Table "${TABLES[Object.keys(TABLES).find((k) => k === key) || key]}" introuvable ou illisible (${res.error}).`);
  });

  if (loadErrors.length) {
    DATA = { loadErrors };
    return;
  }

  const categoriesById = new Map();
  for (const c of categories.rows) categoriesById.set(c[COL.categorie.id], c[COL.categorie.nom]);

  const sousCategoriesById = new Map();
  for (const s of sousCategories.rows) {
    sousCategoriesById.set(s[COL.sousCategorie.id], {
      id: s[COL.sousCategorie.id],
      categorieId: s[COL.sousCategorie.categorie],
      nom: s[COL.sousCategorie.nom],
      code: s[COL.sousCategorie.code],
    });
  }

  let idARepartir = null;
  let idLocalVacant = null;
  for (const [id, nom] of categoriesById.entries()) {
    if (nom === NOM_CATEGORIE_A_REPARTIR) idARepartir = id;
    if (nom === NOM_CATEGORIE_LOCAL_VACANT) idLocalVacant = id;
  }

  const sitesById = new Map();
  for (const s of sites.rows) sitesById.set(s[COL.site.id], s[COL.site.nom]);

  const batimentsById = new Map();
  for (const b of batiments.rows) {
    batimentsById.set(b[COL.batiment.id], {
      id: b[COL.batiment.id],
      nom: b[COL.batiment.nom],
      site: b[COL.batiment.site],
      appellation: b[COL.batiment.appellation],
      destruction: truthy(b[COL.batiment.destruction]),
      finExploitation: b[COL.batiment.finExploitation] || null,
      actif: !truthy(b[COL.batiment.destruction]) && !b[COL.batiment.finExploitation],
    });
  }

  const sallesByBatiment = new Map();
  for (const s of salles.rows) {
    const bid = s[COL.salle.batiment];
    if (!sallesByBatiment.has(bid)) sallesByBatiment.set(bid, []);
    sallesByBatiment.get(bid).push(s);
  }

  DATA = {
    loadErrors: [],
    sitesById, batimentsById, sallesByBatiment,
    categoriesById, sousCategoriesById, idARepartir, idLocalVacant,
  };

  if (idARepartir == null) {
    DATA.loadErrors.push(`Catégorie "${NOM_CATEGORIE_A_REPARTIR}" introuvable dans ${TABLES.categories} : les circulations/sanitaires ne pourront pas être détectés comme "à répartir".`);
  }
  // Pas d'erreur bloquante si "Local vacant" est introuvable : le calcul reste
  // correct, seule la règle d'exclusion des locaux vacants de la répartition
  // (voir classifyBuilding) ne s'applique simplement pas.
}

/* ---------------------------------------------------------------------
 * Classification — cœur du calcul, par bâtiment
 * ------------------------------------------------------------------- */

function round1(v) { return Math.round(v * 10) / 10; }

function actionable(message, numeros) {
  const shown = numeros.slice(0, 5).map((n) => (n == null || n === '' ? '(sans numéro)' : n));
  const extra = numeros.length > shown.length ? ` et ${numeros.length - shown.length} autre(s)` : '';
  return message + (shown.length ? ` — salles concernées : ${shown.join(', ')}${extra}.` : '');
}

function thermalStatus(salle) {
  const c = truthy(salle[COL.salle.chauffee]);
  const r = truthy(salle[COL.salle.rafraichie]);
  if (c && r) return 'CR';
  if (c) return 'C';
  if (r) return 'R';
  return 'N';
}

function classifyBuilding(building) {
  const salles = DATA.sallesByBatiment.get(building.id) || [];
  const warnings = [];

  const consistent = salles.filter((s) => s[COL.salle.site] === building.site);
  const inconsistent = salles.filter((s) => s[COL.salle.site] !== building.site);
  if (inconsistent.length) {
    warnings.push(actionable(
      `${building.nom} : ${inconsistent.length} salle(s) ont un Site différent de celui du bâtiment dans BDD_Salles, exclue(s) du calcul`,
      inconsistent.map((s) => s[COL.salle.numero])
    ));
  }

  const wellFormed = consistent.filter((s) => Number.isInteger(s[COL.salle.categorie]));
  const malformed = consistent.filter((s) => !Number.isInteger(s[COL.salle.categorie]));
  if (malformed.length) {
    warnings.push(actionable(
      `${building.nom} : ${malformed.length} salle(s) ont une Categorie_SCE_OPERAT invalide (erreur de formule dans BDD_Salles ?) — vérifiez et corrigez cette colonne`,
      malformed.map((s) => s[COL.salle.numero])
    ));
  }

  const horsPerimetreRows = wellFormed.filter((s) => s[COL.salle.categorie] === 0);
  const aRepartirRows = DATA.idARepartir != null
    ? wellFormed.filter((s) => s[COL.salle.categorie] === DATA.idARepartir)
    : [];
  const directRowsAll = wellFormed.filter((s) => s[COL.salle.categorie] !== 0 && s[COL.salle.categorie] !== DATA.idARepartir);

  const missingSousCat = directRowsAll.filter((s) => !s[COL.salle.sousCategorie]);
  const direct = directRowsAll.filter((s) => s[COL.salle.sousCategorie]);
  if (missingSousCat.length) {
    warnings.push(actionable(
      `${building.nom} : ${missingSousCat.length} salle(s) ont une Catégorie SCE OPERAT mais pas de Sous-catégorie — vérifiez la colonne SS_categorie_SCE_OPERAT dans BDD_Salles`,
      missingSousCat.map((s) => s[COL.salle.numero])
    ));
  }

  // "Local vacant" est une vraie catégorie SCE OPERAT (locaux réellement
  // inoccupés), pas un fourre-tout : elle garde toujours sa propre surface
  // telle quelle et n'entre jamais dans le calcul de la catégorie dominante,
  // pour ne jamais absorber au prorata la surface d'une autre catégorie
  // minoritaire réellement utilisée (ex. une petite bibliothèque qui ne
  // ferait pas partie des 3 plus grandes catégories du bâtiment).
  const isVacant = (s) => DATA.idLocalVacant != null && s[COL.salle.categorie] === DATA.idLocalVacant;
  const vacantRows = direct.filter(isVacant);
  const usedRows = direct.filter((s) => !isVacant(s));

  const makeGroups = (rows) => {
    const g2 = new Map(); // sousCategorieId -> {total, byStatus}
    for (const s of rows) {
      const ssid = s[COL.salle.sousCategorie];
      if (!g2.has(ssid)) g2.set(ssid, { total: 0, byStatus: { CR: 0, C: 0, R: 0, N: 0 } });
      const g = g2.get(ssid);
      const surf = s[COL.salle.surface] || 0;
      g.total += surf;
      g.byStatus[thermalStatus(s)] += surf;
    }
    return g2;
  };

  const groups = makeGroups(usedRows); // catégories "utilisées", candidates à la règle dominante
  const vacantGroups = makeGroups(vacantRows); // "Local vacant", toujours en ligne(s) à part

  const lineFromGroup = (ssid, st, m2) => {
    const info = DATA.sousCategoriesById.get(ssid);
    return {
      sousCategorieId: ssid,
      sousCategorieNom: info ? info.nom : `Sous-catégorie #${ssid}`,
      categorieNom: info ? (DATA.categoriesById.get(info.categorieId) || '') : '',
      code: info ? info.code : '',
      status: st,
      statusLabel: STATUS_LABEL[st],
      m2,
    };
  };
  const addVacantLines = (result) => {
    for (const [ssid, g] of vacantGroups.entries()) {
      for (const st of STATUSES) {
        if (g.byStatus[st] > 0.005) result.lines.push(lineFromGroup(ssid, st, g.byStatus[st]));
      }
    }
  };

  const aRepByStatus = { CR: 0, C: 0, R: 0, N: 0 };
  for (const s of aRepartirRows) aRepByStatus[thermalStatus(s)] += (s[COL.salle.surface] || 0);
  const totalARepartir = STATUSES.reduce((sum, st) => sum + aRepByStatus[st], 0);

  const horsPerimetreTotal = horsPerimetreRows.reduce((sum, s) => sum + (s[COL.salle.surface] || 0), 0);
  const totalVacant = Array.from(vacantGroups.values()).reduce((sum, g) => sum + g.total, 0);
  const totalDirect = Array.from(groups.values()).reduce((sum, g) => sum + g.total, 0); // hors "Local vacant"
  const totalSurfaceBatiment = totalDirect + totalVacant + totalARepartir + horsPerimetreTotal;

  const result = {
    buildingId: building.id,
    buildingNom: building.nom,
    appellation: building.appellation,
    warnings,
    horsPerimetreTotal,
    totalSurfaceBatiment,
    nonClasseTotal: 0,
    lines: [],
    selected: [],
    top1SharePct: null,
    totalOperat: 0,
    noDominantCategory: false,
  };

  if (totalDirect <= 0) {
    // Aucune catégorie "utilisée" en affectation directe : le "à répartir"
    // ne peut être redistribué nulle part et reste non classé. "Local
    // vacant", lui, reste classé tel quel (ce n'est pas une anomalie).
    result.nonClasseTotal = totalARepartir;
    if (totalARepartir > 0) {
      result.noDominantCategory = true;
      warnings.push(actionable(
        `${building.nom} : aucune sous-catégorie OPERAT "utilisée" directement affectée dans ce bâtiment (hors Local vacant) — impossible d'appliquer la règle de catégorie dominante (${round1(totalARepartir)} m² à répartir restent non classés)`,
        []
      ));
    }
    addVacantLines(result);
    result.totalOperat = result.lines.reduce((sum, l) => sum + l.m2, 0);
    return result;
  }

  const sortedGroups = Array.from(groups.entries()).sort((a, b) => b[1].total - a[1].total);
  const top1Share = sortedGroups[0][1].total / totalDirect;
  const selectedEntries = top1Share >= DOMINANT_THRESHOLD ? sortedGroups.slice(0, 1) : sortedGroups.slice(0, MAX_SELECTED);

  const sumSelected = selectedEntries.reduce((sum, [, g]) => sum + g.total, 0);
  const weights = new Map(selectedEntries.map(([ssid, g]) => [ssid, g.total / sumSelected]));

  const grandTotalByStatus = { CR: 0, C: 0, R: 0, N: 0 };
  for (const g of groups.values()) for (const st of STATUSES) grandTotalByStatus[st] += g.byStatus[st];
  for (const st of STATUSES) grandTotalByStatus[st] += aRepByStatus[st];

  for (const [ssid, g] of selectedEntries) {
    for (const st of STATUSES) {
      const m2 = weights.get(ssid) * grandTotalByStatus[st];
      if (m2 > 0.005) result.lines.push(lineFromGroup(ssid, st, m2));
    }
  }
  addVacantLines(result);
  result.totalOperat = result.lines.reduce((sum, l) => sum + l.m2, 0);
  result.selected = selectedEntries.map(([ssid, g]) => ({
    nom: (DATA.sousCategoriesById.get(ssid) || {}).nom || `Sous-catégorie #${ssid}`,
    surface: g.total,
    sharePct: (g.total / totalDirect) * 100,
  }));
  result.top1SharePct = top1Share * 100;
  return result;
}

function activeBuildingsForSite(siteId) {
  return Array.from(DATA.batimentsById.values()).filter((b) => b.site === siteId && b.actif);
}

function siteIdByName(name) {
  for (const [id, nom] of DATA.sitesById.entries()) if (nom === name) return id;
  return null;
}

function aggregateSite(siteId) {
  const buildings = activeBuildingsForSite(siteId).sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  const buildingResults = buildings.map((b) => ({ building: b, result: classifyBuilding(b) }));

  const lineKey = (l) => l.sousCategorieId + '|' + l.status;
  const lines = new Map();
  let horsPerimetreTotal = 0;
  let totalSurfaceEfa = 0;
  let nonClasseTotal = 0;
  const warnings = [];
  const noDominantBuildings = [];

  for (const { building, result } of buildingResults) {
    horsPerimetreTotal += result.horsPerimetreTotal;
    totalSurfaceEfa += result.totalSurfaceBatiment;
    nonClasseTotal += result.nonClasseTotal;
    warnings.push(...result.warnings);
    if (result.noDominantCategory) noDominantBuildings.push(building.nom);
    for (const l of result.lines) {
      const k = lineKey(l);
      if (!lines.has(k)) {
        lines.set(k, { sousCategorieNom: l.sousCategorieNom, categorieNom: l.categorieNom, code: l.code, status: l.status, statusLabel: l.statusLabel, m2: 0 });
      }
      lines.get(k).m2 += l.m2;
    }
  }

  const totalOperat = Array.from(lines.values()).reduce((sum, l) => sum + l.m2, 0);
  const totalByStatus = { CR: 0, C: 0, R: 0, N: 0 };
  for (const l of lines.values()) totalByStatus[l.status] += l.m2;

  return {
    siteId,
    siteNom: DATA.sitesById.get(siteId),
    buildingResults,
    lines: Array.from(lines.values()).sort((a, b) => (a.categorieNom + a.sousCategorieNom).localeCompare(b.categorieNom + b.sousCategorieNom, 'fr') || a.status.localeCompare(b.status)),
    totalOperat, totalByStatus, horsPerimetreTotal, totalSurfaceEfa, nonClasseTotal,
    warnings, noDominantBuildings,
    nbBatiments: buildings.length,
  };
}

/* ---------------------------------------------------------------------
 * Rendu
 * ------------------------------------------------------------------- */

function fmt(v) {
  return v.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderWarnings(warnings) {
  if (!warnings.length) return '';
  return `<div id="warnings">${warnings.map((w) => `<span class="w">${esc(w)}</span>`).join('')}</div>`;
}

function statusColumnsHeader() {
  return STATUSES.map((st) => `<th class="num">${STATUS_LABEL[st]}</th>`).join('') + '<th class="num">Total</th>';
}

function linesTable(lines, totalOperat) {
  // group by categorie, then sous-categorie, columns = 4 statuts + total
  const byCat = new Map();
  for (const l of lines) {
    if (!byCat.has(l.categorieNom)) byCat.set(l.categorieNom, new Map());
    const bySs = byCat.get(l.categorieNom);
    if (!bySs.has(l.sousCategorieNom)) bySs.set(l.sousCategorieNom, { code: l.code, byStatus: {} });
    bySs.get(l.sousCategorieNom).byStatus[l.status] = l.m2;
  }

  let rows = '';
  for (const [catNom, bySs] of Array.from(byCat.entries()).sort((a, b) => a[0].localeCompare(b[0], 'fr'))) {
    let catTotal = 0;
    for (const info of bySs.values()) for (const st of STATUSES) catTotal += info.byStatus[st] || 0;
    rows += `<tr class="catRow"><td class="lib" colspan="${STATUSES.length + 1}">${esc(catNom || '(catégorie inconnue)')}</td><td class="num">${fmt(catTotal)}</td></tr>`;
    for (const [ssNom, info] of Array.from(bySs.entries()).sort((a, b) => a[0].localeCompare(b[0], 'fr'))) {
      let ssTotal = 0;
      const cells = STATUSES.map((st) => {
        const v = info.byStatus[st] || 0;
        ssTotal += v;
        return `<td class="num">${v > 0.005 ? fmt(v) : '—'}</td>`;
      }).join('');
      rows += `<tr class="subRow"><td class="lib">${esc(ssNom)}${info.code ? ` <span class="code">${esc(info.code)}</span>` : ''}</td>${cells}<td class="num">${fmt(ssTotal)}</td></tr>`;
    }
  }
  const totalsByStatus = STATUSES.map((st) => lines.filter((l) => l.status === st).reduce((s, l) => s + l.m2, 0));
  rows += `<tr class="totalRow"><td class="lib">Total OPERAT</td>${totalsByStatus.map((v) => `<td class="num">${fmt(v)}</td>`).join('')}<td class="num">${fmt(totalOperat)}</td></tr>`;

  return `<div class="tableWrap"><table>
    <thead><tr><th>Sous-catégorie SCE OPERAT</th>${statusColumnsHeader()}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function kpiRow(agg) {
  const nonClasseKpi = agg.nonClasseTotal > 0.005
    ? `<div class="kpi" style="background:#fde2e2;border-color:#e0554f"><div class="val" style="color:var(--bad)">${fmt(agg.nonClasseTotal)} m²</div><div class="lbl">Non classé — aucune catégorie dominante (à vérifier)</div></div>`
    : '';
  return `<div class="kpiRow">
    <div class="kpi"><div class="val">${fmt(agg.totalOperat)} m²</div><div class="lbl">Surface OPERAT (hors périmètre exclu)</div></div>
    <div class="kpi"><div class="val">${fmt(agg.totalByStatus.CR)} m²</div><div class="lbl">${STATUS_LABEL.CR}</div></div>
    <div class="kpi"><div class="val">${fmt(agg.totalByStatus.C)} m²</div><div class="lbl">${STATUS_LABEL.C}</div></div>
    <div class="kpi"><div class="val">${fmt(agg.totalByStatus.R)} m²</div><div class="lbl">${STATUS_LABEL.R}</div></div>
    <div class="kpi"><div class="val">${fmt(agg.totalByStatus.N)} m²</div><div class="lbl">${STATUS_LABEL.N}</div></div>
    <div class="kpi muted"><div class="val">${fmt(agg.horsPerimetreTotal)} m²</div><div class="lbl">Hors périmètre (info, exclu du total)</div></div>
    <div class="kpi muted"><div class="val">${agg.nbBatiments}</div><div class="lbl">Bâtiments actifs pris en compte</div></div>
    ${nonClasseKpi}
  </div>`;
}

function renderOverview() {
  const aggs = EFA_NAMES.map((name) => {
    const siteId = siteIdByName(name);
    return siteId != null ? aggregateSite(siteId) : null;
  });

  const grandTotal = aggs.reduce((sum, a) => sum + (a ? a.totalOperat : 0), 0);
  const grandHorsPerimetre = aggs.reduce((sum, a) => sum + (a ? a.horsPerimetreTotal : 0), 0);
  const grandNonClasse = aggs.reduce((sum, a) => sum + (a ? a.nonClasseTotal : 0), 0);
  const grandWarnings = aggs.reduce((sum, a) => sum + (a ? a.warnings.length : 0), 0);
  const grandBatiments = aggs.reduce((sum, a) => sum + (a ? a.nbBatiments : 0), 0);

  const rows = EFA_NAMES.map((name, i) => {
    const a = aggs[i];
    if (!a) return `<tr><td class="lib">${esc(name)}</td><td colspan="8" style="color:var(--bad)">Site introuvable dans ${esc(TABLES.sites)}</td></tr>`;
    return `<tr>
      <td class="lib"><button class="efaLink" data-site="${a.siteId}">${esc(name)}</button></td>
      <td class="num">${a.nbBatiments}</td>
      <td class="num">${fmt(a.totalOperat)}</td>
      <td class="num">${fmt(a.totalByStatus.CR)}</td>
      <td class="num">${fmt(a.totalByStatus.C)}</td>
      <td class="num">${fmt(a.totalByStatus.R)}</td>
      <td class="num">${fmt(a.totalByStatus.N)}</td>
      <td class="num">${fmt(a.horsPerimetreTotal)}</td>
      <td class="num" style="${a.nonClasseTotal > 0.005 ? 'color:var(--bad);font-weight:700' : ''}">${a.nonClasseTotal > 0.005 ? fmt(a.nonClasseTotal) : '—'}</td>
      <td class="num">${a.warnings.length || '—'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="card">
      <h2>Vue d'ensemble — 5 EFA</h2>
      <div class="subhead">Cliquez sur le nom d'un EFA pour voir son détail (résultat par bâtiment, avertissements).</div>
      <div class="kpiRow">
        <div class="kpi"><div class="val">${fmt(grandTotal)} m²</div><div class="lbl">Surface OPERAT totale (5 EFA)</div></div>
        <div class="kpi muted"><div class="val">${fmt(grandHorsPerimetre)} m²</div><div class="lbl">Hors périmètre (info)</div></div>
        <div class="kpi muted"><div class="val">${grandBatiments}</div><div class="lbl">Bâtiments actifs</div></div>
        <div class="kpi muted"><div class="val">${grandWarnings}</div><div class="lbl">Avertissements à vérifier</div></div>
        ${grandNonClasse > 0.005 ? `<div class="kpi" style="background:#fde2e2;border-color:#e0554f"><div class="val" style="color:var(--bad)">${fmt(grandNonClasse)} m²</div><div class="lbl">Non classé — aucune catégorie dominante</div></div>` : ''}
      </div>
      <div class="tableWrap" style="margin-top:12px">
        <table>
          <thead><tr><th>EFA</th><th class="num">Bâtiments</th><th class="num">Total OPERAT</th><th class="num">${STATUS_LABEL.CR}</th><th class="num">${STATUS_LABEL.C}</th><th class="num">${STATUS_LABEL.R}</th><th class="num">${STATUS_LABEL.N}</th><th class="num">Hors périmètre</th><th class="num">Non classé</th><th class="num">Avert.</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h2>Détail par EFA — catégories utilisées et surfaces par statut thermique</h2>
      <div class="subhead">Pour chaque EFA, les sous-catégories SCE OPERAT effectivement utilisées avec leur surface en chauffée, chauffée + rafraîchie, rafraîchie et non chauffée.</div>
      ${EFA_NAMES.map((name, i) => {
        const a = aggs[i];
        if (!a) return '';
        return `<details class="buildingRow" open>
          <summary><span class="bName">${esc(name)}</span><span class="bMeta">${fmt(a.totalOperat)} m² OPERAT au total</span></summary>
          <div class="buildingDetail">${a.lines.length ? linesTable(a.lines, a.totalOperat) : '<div class="subhead">Aucune surface classée pour cet EFA.</div>'}</div>
        </details>`;
      }).join('')}
    </div>`;
}

function buildingDetailHtml(building, result) {
  let inner = '';
  if (result.noDominantCategory) {
    inner += `<div class="noDominantNote">Aucune sous-catégorie dominante identifiable dans ce bâtiment (pas de surface en affectation directe) — ${fmt(result.totalSurfaceBatiment)} m² non classés, à vérifier manuellement.</div>`;
  } else {
    inner += `<div style="margin:6px 0">Sous-catégorie(s) retenue(s) comme dominante(s)${result.top1SharePct >= DOMINANT_THRESHOLD * 100 ? ' (règle des 70%)' : ' (règle des 2-3 catégories principales)'} : `
      + result.selected.map((s) => `<span class="selectedTag">${esc(s.nom)} — ${round1(s.surface)} m² (${round1(s.sharePct)}%)</span>`).join('')
      + `</div>`;
    inner += linesTable(result.lines, result.totalOperat);
  }
  if (result.horsPerimetreTotal > 0.005) {
    inner += `<div class="bMeta" style="margin-top:8px">Hors périmètre (structures non occupées, exclues du total OPERAT) : ${fmt(result.horsPerimetreTotal)} m²</div>`;
  }
  if (result.warnings.length) {
    inner += renderWarnings(result.warnings);
  }
  return inner;
}

function renderEfaPage(siteId) {
  const agg = aggregateSite(siteId);
  const buildingsHtml = agg.buildingResults.map(({ building, result }) => {
    const label = result.noDominantCategory
      ? '<span style="color:var(--warn)">à vérifier — pas de catégorie dominante</span>'
      : result.selected.map((s) => esc(s.nom)).join(' + ');
    return `<details class="buildingRow">
      <summary>
        <span class="bName">${esc(building.nom)}</span>
        <span class="bMeta">${esc(building.appellation || '')}</span>
        <span class="bMeta">${fmt(result.totalSurfaceBatiment)} m² au total</span>
        <span class="bMeta">→ ${label}</span>
        ${result.warnings.length ? `<span class="bMeta" style="color:var(--warn)">⚠ ${result.warnings.length}</span>` : ''}
      </summary>
      <div class="buildingDetail">${buildingDetailHtml(building, result)}</div>
    </details>`;
  }).join('');

  return `
    <div class="card">
      <h2>${esc(agg.siteNom)}</h2>
      <div class="subhead">Résultat agrégé pour cet EFA — c'est ce total qui doit être renseigné dans OPERAT.</div>
      ${kpiRow(agg)}
      ${renderWarnings(agg.warnings)}
      <details class="section" open style="margin-top:12px">
        <summary>Sous-catégorie SCE OPERAT</summary>
        ${linesTable(agg.lines, agg.totalOperat)}
      </details>
    </div>
    <div class="card">
      <details class="section" open>
        <summary>Détail par bâtiment (${agg.nbBatiments})</summary>
        <div class="subhead">Cliquez sur un bâtiment pour dérouler son détail et vérifier la classification retenue.</div>
        ${buildingsHtml || '<div class="subhead">Aucun bâtiment actif pour cet EFA.</div>'}
      </details>
    </div>`;
}

function render() {
  const content = document.getElementById('content');
  if (!DATA) { content.innerHTML = '<div id="emptyState">Chargement…</div>'; return; }
  if (DATA.loadErrors && DATA.loadErrors.length) {
    content.innerHTML = `<div id="warnings">${DATA.loadErrors.map((e) => `<span class="w bad">${esc(e)}</span>`).join('')}</div>`;
    return;
  }
  const sel = document.getElementById('efaSelect');
  const siteId = sel.value ? Number(sel.value) : null;
  content.innerHTML = siteId != null ? renderEfaPage(siteId) : renderOverview();

  content.querySelectorAll('.efaLink').forEach((btn) => {
    btn.addEventListener('click', () => {
      sel.value = btn.dataset.site;
      onEfaChange();
    });
  });
}

function populateEfaSelect() {
  const sel = document.getElementById('efaSelect');
  sel.innerHTML = '<option value="">Vue d\'ensemble (tous les EFA)</option>';
  for (const name of EFA_NAMES) {
    const siteId = siteIdByName(name);
    const opt = document.createElement('option');
    opt.value = siteId != null ? String(siteId) : '';
    opt.textContent = siteId != null ? name : `${name} (introuvable)`;
    opt.disabled = siteId == null;
    sel.appendChild(opt);
  }
}

async function onEfaChange() {
  const sel = document.getElementById('efaSelect');
  render();
  try { await grist.setOption('lastSiteId', sel.value); } catch (e) { /* pas bloquant */ }
}

document.getElementById('efaSelect').addEventListener('change', onEfaChange);
document.getElementById('printBtn').addEventListener('click', () => {
  // Les <details> repliés (chapitres, bâtiments) ne rendent pas leur contenu :
  // on les ouvre le temps de l'impression/export PDF pour que rien ne manque
  // sur le papier, puis on restaure l'état d'affichage écran ensuite.
  const content = document.getElementById('content');
  const closedDetails = Array.from(content.querySelectorAll('details:not([open])'));
  closedDetails.forEach((d) => { d.open = true; });
  const restore = () => {
    closedDetails.forEach((d) => { d.open = false; });
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore);
  window.print();
});
document.getElementById('helpBtn').addEventListener('click', () => {
  const content = document.getElementById('content');
  const already = document.getElementById('helpCard');
  if (already) { already.remove(); return; }
  const div = document.createElement('div');
  div.className = 'card';
  div.id = 'helpCard';
  div.innerHTML = `<h2>Méthode de calcul</h2><div class="helpText">
    <p>Ce widget agrège <b>BDD_Salles</b> par bâtiment puis par EFA (site), en
    s'appuyant sur les colonnes déjà renseignées salle par salle :
    <b>Categorie_SCE_OPERAT</b> et <b>SS_categorie_SCE_OPERAT</b>.</p>
    <ul>
      <li><b>Catégorie vide (0)</b> → hors périmètre (structures non occupées :
      escaliers-vides, toitures, rampes…), exclu du total OPERAT, affiché à
      part pour information.</li>
      <li><b>Catégorie "${esc(NOM_CATEGORIE_A_REPARTIR)}"</b> → circulations,
      sanitaires, locaux techniques… sans équivalent OPERAT propre, à
      répartir dans les sous-catégories dominantes "utilisées" du bâtiment
      (voir ci-dessous).</li>
      <li><b>Catégorie "${esc(NOM_CATEGORIE_LOCAL_VACANT)}"</b> → locaux
      réellement inoccupés. Toujours affichée avec sa propre surface, telle
      quelle : elle ne participe jamais à la règle de catégorie dominante et
      ne reçoit donc jamais de surface redistribuée d'une autre catégorie.</li>
      <li><b>Autre catégorie</b> → affectation directe à sa sous-catégorie SCE
      OPERAT.</li>
    </ul>
    <p><b>Règle de catégorie dominante</b>, appliquée bâtiment par bâtiment sur
    la surface des catégories "utilisées" (hors "à répartir" et hors
    "${esc(NOM_CATEGORIE_LOCAL_VACANT)}") :</p>
    <ul>
      <li>si une sous-catégorie atteint <b>${Math.round(DOMINANT_THRESHOLD * 100)}%</b> ou plus de cette
      surface, tout le bâtiment (y compris "à répartir") lui est affecté ;</li>
      <li>sinon, les <b>${MAX_SELECTED} sous-catégories</b> "utilisées" les plus
      grandes sont retenues, et 100% de la surface du bâtiment restant à
      classer (catégories minoritaires non retenues + "à répartir", mais
      jamais "${esc(NOM_CATEGORIE_LOCAL_VACANT)}") leur est répartie au
      prorata de leurs surfaces respectives.</li>
    </ul>
    <p>Exemple : une petite bibliothèque (40 m², catégorie "Culture et
    spectacles") dans un bâtiment surtout composé de bureaux, de salles de
    cours et de locaux vacants ne fera pas partie des catégories dominantes
    retenues — sa surface est alors répartie au prorata entre les catégories
    "utilisées" retenues (bureaux, salles de cours…), jamais vers "Local
    vacant".</p>
    <p>La répartition est ensuite recalculée dans les mêmes proportions pour
    chacun des 4 statuts thermiques (chauffée + rafraîchie / chauffée seule /
    rafraîchie seule / non chauffée), à partir du statut thermique réel de
    chaque salle.</p>
    <p>Le calcul est fait <b>bâtiment par bâtiment</b> puis sommé au niveau
    EFA — jamais directement sur l'agrégat de plusieurs bâtiments, dont la
    composition de surfaces diffère à chaque fois.</p>
    <p>Les bâtiments détruits ou dont la date de fin d'exploitation est
    renseignée sont exclus. Les salles dont le Site diverge de celui de leur
    bâtiment, celles à Catégorie SCE OPERAT invalide, et celles à catégorie
    renseignée mais sans sous-catégorie, sont exclues du calcul et listées en
    avertissement.</p>
  </div>`;
  content.prepend(div);
});

async function boot() {
  grist.onOptions(async (options) => {
    await loadData();
    if (DATA && !DATA.loadErrors.length) {
      populateEfaSelect();
      const sel = document.getElementById('efaSelect');
      const last = options && options.lastSiteId;
      if (last && Array.from(sel.options).some((o) => o.value === String(last))) sel.value = String(last);
    }
    render();
  });
  grist.ready({ requiredAccess: 'full' });
}

boot();
</script>
</body>
</html>
