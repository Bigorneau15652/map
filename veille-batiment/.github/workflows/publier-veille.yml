name: Publier la veille dans Grist

on:
  push:
    branches: [main]
    paths:
      - "veilles/**"
  workflow_dispatch:
    inputs:
      mois:
        description: "Mois a publier au format AAAA-MM. Laisser vide pour le plus recent."
        required: false
        default: ""

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Determiner le mois a publier
        id: mois
        run: |
          MOIS="${{ github.event.inputs.mois }}"
          if [ -z "$MOIS" ]; then
            MOIS=$(ls veilles/*.md 2>/dev/null | sed 's#veilles/##; s#\.md$##' | sort | tail -1)
          fi
          if [ -z "$MOIS" ]; then
            echo "Aucune veille a publier."
            exit 1
          fi
          echo "valeur=$MOIS" >> "$GITHUB_OUTPUT"
          echo "Mois retenu : $MOIS"

      - name: Envoyer vers Grist
        env:
          GRIST_SERVER: ${{ secrets.GRIST_SERVER }}
          GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
        run: python3 scripts/grist_sync.py publier-veille "${{ steps.mois.outputs.valeur }}"

      - name: Envoyer la synthese par email
        env:
          SMTP_SERVEUR: ${{ secrets.SMTP_SERVEUR }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_UTILISATEUR: ${{ secrets.SMTP_UTILISATEUR }}
          SMTP_MOT_DE_PASSE: ${{ secrets.SMTP_MOT_DE_PASSE }}
          EMAIL_EXPEDITEUR: ${{ secrets.EMAIL_EXPEDITEUR }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
        run: python3 scripts/envoyer_email.py "${{ steps.mois.outputs.valeur }}"
