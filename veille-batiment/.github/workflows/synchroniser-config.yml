name: Relire les tables de pilotage Grist

on:
  schedule:
    # Le 4 de chaque mois a 04h00 UTC, la veille de la recherche mensuelle.
    - cron: "0 4 4 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Lire Veille_Themes et Veille_Sources dans Grist
        env:
          GRIST_SERVER: ${{ secrets.GRIST_SERVER }}
          GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
        run: python3 scripts/grist_sync.py exporter-config

      - name: Enregistrer les modifications
        run: |
          if [ -z "$(git status --porcelain protocole/themes.json protocole/sources.json)" ]; then
            echo "Aucune modification du pilotage."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocole/themes.json protocole/sources.json
          git commit -m "Mise a jour du pilotage de veille depuis Grist"
          git push
