name: Initialiser les tables de pilotage Grist

# A lancer une seule fois, manuellement, apres avoir cree les quatre tables
# dans Grist. Remplit Veille_Themes et Veille_Sources avec les valeurs par
# defaut du depot. Relancer ce workflow ne fait qu'ecraser les lignes de meme
# theme ou de meme domaine, les lignes que vous avez ajoutees sont conservees.

on:
  workflow_dispatch:

jobs:
  initialiser:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Envoyer les themes et les sources par defaut
        env:
          GRIST_SERVER: ${{ secrets.GRIST_SERVER }}
          GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
        run: python3 scripts/grist_sync.py initialiser-config
