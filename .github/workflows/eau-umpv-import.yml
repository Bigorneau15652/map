name: Import UMPV water consumption into Grist

on:
  schedule:
    # Every night at 05:17 UTC (off-the-hour to avoid GitHub's cron rush).
    - cron: "17 5 * * *"
  workflow_dispatch: {}

jobs:
  import-beziers:
    name: Beziers (SUEZ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r eau-umpv-import/requirements.txt

      - name: Run import
        working-directory: eau-umpv-import
        env:
          SUEZ_USERNAME: ${{ secrets.SUEZ_USERNAME }}
          SUEZ_PASSWORD: ${{ secrets.SUEZ_PASSWORD }}
          SUEZ_METER_ID: ${{ secrets.SUEZ_METER_ID }}
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
          GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
          GRIST_TABLE_ID: ${{ secrets.GRIST_TABLE_ID }}
          GRIST_SERVER: ${{ secrets.GRIST_SERVER }}
        run: python import_suez_beziers.py

  # import-regie3m:
  #   Site: Route de Mende / Boutonnet / Saint-Charles / Saint-Louis (Regie des
  #   Eaux 3M, https://ael.regiedeseaux3m.fr). Not wired up yet: this portal
  #   has no known open-source client, and needs either a HAR export of the
  #   login + consumption pages, or a few rounds of trial-and-error against
  #   real Action run logs, to build reliably. See eau-umpv-import/README.md.
